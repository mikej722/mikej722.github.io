<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OFHS Basketball Archive</title>
<style>body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:48px 20px;text-align:center;background:#fff;color:#16181d}
@media(prefers-color-scheme:dark){body{background:#0f1115;color:#e8eaed}a{color:#7aa7ff}}</style>
<script>
(function(){
var code=location.pathname.replace(/^\/+|\/+$/g,'').toLowerCase();
var idx='https://mikej722.github.io/ofhs-basketball-artifacts/';
fetch(idx+'links.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(d){
 for(var i=0;i<d.items.length;i++){if(d.items[i].c===code){location.replace(d.base+d.items[i].p);return;}}
 document.getElementById('msg').innerHTML='That link wasn’t found. <a href="'+idx+'">Browse the full archive</a>.';
}).catch(function(){document.getElementById('msg').innerHTML='<a href="'+idx+'">Open the archive</a>.';});
})();
</script></head><body><p id="msg">Opening clipping…</p></body></html>
